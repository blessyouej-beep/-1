<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키오스크 주문 연습 | 학생용</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fc;color:#17345d;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{text-align:center;font-size:clamp(28px,4vw,42px)}h2{font-size:clamp(24px,3vw,32px)}p{font-size:20px}.top{display:flex;justify-content:flex-end}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:white;border-radius:20px;padding:22px;margin:18px 0}.card{text-align:center}.emoji{font-size:70px}.name{font-size:26px;font-weight:800}.price{font-size:24px;font-weight:700}button{font:inherit;font-size:23px;font-weight:800;min-height:60px;padding:12px 22px;border:0;border-radius:14px;background:#245bd3;color:white;cursor:pointer}button:disabled{background:#aab5c7;cursor:not-allowed}.secondary{background:#e7eefb;color:#17345d}.danger{background:#c43f43}.wide{width:100%;margin-top:12px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;font-size:23px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls button{min-width:58px}.muted{color:#57677c}.notice{text-align:center;font-size:17px;color:#596579;padding:16px}.total{font-size:30px;font-weight:900}.hidden{display:none!important}input{font:inherit;font-size:22px;padding:12px;width:100%;border:2px solid #aabbd6;border-radius:12px}label{display:block;font-size:21px;font-weight:700;margin:14px 0}.editrow{border-bottom:1px solid #ddd;padding-bottom:14px}.center{text-align:center}.orderNo{font-size:76px;color:#15803d;font-weight:900}.success{background:#e6f7eb;padding:24px;border-radius:20px;text-align:center}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr}.emoji{font-size:62px}.line{flex-wrap:wrap}button{font-size:21px}}</style></head><body><main><h1>🍽️ 키오스크 주문 연습</h1><h2 class="center" id="heading">먹고 싶은 메뉴를 골라요.</h2><section id="menuPage"><div id="menuGrid" class="grid"></div><div class="panel"><h2>🛒 장바구니</h2><div id="cart"></div><div class="line total"><span id="count"></span><span id="sum"></span></div><button id="confirmButton" class="wide" onclick="go('confirm')">주문 확인 →</button></div></section><section id="confirmPage" class="panel hidden"><h2>주문 내역</h2><div id="confirmDetails"></div><h2 class="center">이 메뉴를 주문할까요?</h2><button class="wide" onclick="go('done')">주문하기</button><button class="wide secondary" onclick="go('menu')">다시 고르기</button></section><section id="donePage" class="panel hidden"><div class="success"><h2>🎉 주문 연습을 마쳤어요!</h2><p>연습용 주문번호</p><div class="orderNo">001</div></div><h2>주문 내역</h2><div id="doneDetails"></div><h2 class="center">🔔 번호가 불리면 음식을 받아요.</h2><button class="wide" onclick="reset()">다시 연습하기</button></section><p class="notice">연습용 화면이며 실제 주문과 결제는 되지 않아요.</p></main><script>const defaults=[{name:'김밥',emoji:'🍙',price:3000},{name:'샌드위치',emoji:'🥪',price:4000},{name:'주스',emoji:'🧃',price:2000}];let menus=structuredClone(defaults);let cart=[0,0,0],page='menu';const won=n=>n.toLocaleString('ko-KR')+'원';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function change(i,n){cart[i]=Math.max(0,cart[i]+n);render()}function removeItem(i){cart[i]=0;render()}function render(){document.getElementById('menuGrid').innerHTML=menus.map((m,i)=>`<div class="card"><div class="emoji">${esc(m.emoji)}</div><div class="name">${esc(m.name)}</div><div class="price">${won(m.price)}</div><button class="wide" onclick="change(${i},1)">담기 +</button></div>`).join('');const items=menus.map((m,i)=>cart[i]?`<div class="editrow"><div class="line"><b>${esc(m.emoji)} ${esc(m.name)}</b><b>${won(m.price*cart[i])}</b></div><div class="controls"><button class="secondary" onclick="change(${i},-1)">−</button><b>${cart[i]}개</b><button class="secondary" onclick="change(${i},1)">+</button><button class="danger" onclick="removeItem(${i})">삭제</button></div></div>`:'').join('');document.getElementById('cart').innerHTML=items||'<p class="muted center">장바구니가 비어 있어요.</p>';const qty=cart.reduce((a,b)=>a+b,0),sum=cart.reduce((a,b,i)=>a+b*menus[i].price,0);document.getElementById('count').textContent='총 '+qty+'개';document.getElementById('sum').textContent=won(sum);document.getElementById('confirmButton').disabled=qty===0;const details=menus.map((m,i)=>cart[i]?`<div class="line"><span>${esc(m.emoji)} ${esc(m.name)} × ${cart[i]}개</span><b>${won(m.price*cart[i])}</b></div>`:'').join('')+`<hr><div class="line total"><span>총 ${qty}개</span><span>${won(sum)}</span></div>`;document.getElementById('confirmDetails').innerHTML=details;document.getElementById('doneDetails').innerHTML=details}function go(next){if((next==='confirm'||next==='done')&&!cart.some(Boolean))return;page=next;for(const key of ['menu','confirm','done'])document.getElementById(key+'Page').classList.toggle('hidden',key!==next);document.getElementById('heading').textContent=({menu:'먹고 싶은 메뉴를 골라요.',confirm:'주문을 확인해요.',done:'주문 연습을 마쳤어요!'})[next];render();window.scrollTo(0,0)}function reset(){cart=[0,0,0];go('menu')}render();</script></body></html>
